<script type="text/html" data-help-name="max-panel">
    <p>Узел конфигурации панели MAX.</p>
    <p>Каждое соединение может иметь несколько панелей, но только одна активна в любой момент времени.</p>

    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt>Имя</dt>
        <dd>Имя узла для отображения в редакторе Node-RED. Если не указано, используется заголовок панели.</dd>

        <dt>Соединение <span class="required">обязательно</span></dt>
        <dd>Ссылка на узел <code>max-ws-config</code> (WebSocket-соединение). Обязательно для выбора — без него сохранение невозможно.</dd>

        <dt>Заголовок <span class="required">обязательно</span></dt>
        <dd>Текст, который отображается в заголовке панели MAX. Этот текст видит пользователь.</dd>

        <dt>Главная панель по умолчанию <span class="required">обязательно</span></dt>
        <dd>Галочка, устанавливающая данную панель основной при запуске и обновлении. <b>Должна быть единственной</b> среди всех узлов <code>max-panel</code> выбранного соединения.</dd>
    </dl>

    <h3>Поведение</h3>
    <p>При старте узел, указаный в <b>Соединение</b> устанавливает WSS-соединения с сервером MAX. После подключения:</p>
    <ul>
        <li>Отправляет главную панель с кнопками для всех адресатов указанного соединения <code>max-ws-config</code></li>
        <li>Обновляет панель на главную по таймеру (если интервал &gt; 0)</li>
        <li>Переключает текущую панель на выбранную с помощью узла <code>max-switch</code></li>
    </ul>
    <p>Кнопки в панели располагаются автоматически: по 3 в ряд, если кнопок меньше 10, и по 4 в ряд, если 10 и более.</p>
</script>

<script type="text/html" data-help-name="max-ws-config">
    <p>Узел конфигурации соединения с MAX-ботом.</p><p>Поддерживает несколько пользователей, автоматическое переподключение и управление панелями.</p>
    <p>Создаёт постоянные WSS-подключения к серверу MAX, через которое получает события нажатий на кнопки панели управления. Также отвечает за отправку и обновление панели с кнопками.</p>

    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt>URL <span class="required">обязательно</span></dt>
        <dd>Адрес MAX-бота без протокола. Протоколы <code>https://</code> и <code>wss://</code> отсекаются автоматически. Пример: <code>notify.example.com</code></dd>

        <dt>Интервал <span class="required">обязательно</span></dt>
        <dd>Интервал автообновления панели в секундах. По умолчанию 28800 (8 часов). Значение <code>0</code> отключает автообновление. При обновлении старое сообщение удаляется и отправляется новое.</dd>

        <dt>Ключ MID <span class="required">обязательно</span></dt>
        <dd>Имя глобальной переменной для хранения идентификатора сообщения (MID). <b>Должно быть уникальным</b> среди всех узлов max-ws-config. Используется для удаления старой панели перед отправкой новой.</dd>
        <dd>Хранилище контекста Node-RED для сохранения ключа MID выбирается из доступных в настройках <code>settings.js</code>. Рекомендуется выбрать <code>file</code>, чтобы не терять значение при перезагрузке.</dd>

        <dt>Адресаты <span class="required">обязательно</span></dt>
        <dd>ID пользователя, которому отправляется панель управления с кнопками.</dd>
        <dd>Токен авторизации для подключения к MAX-боту. Передаётся в заголовке <code>Authorization</code>.</dd>
    </dl>

    <h3>Поведение</h3>
    <p>При старте узел устанавливает WSS-соединения с сервером MAX. После подключения:</p>
    <ul>
        <li>Отправляет главную панель с кнопками (узлы <code>max-control</code>) для всех адресатов</li>
        <li>Поддерживает соединение пингами каждые 25 секунд</li>
        <li>Обновляет панель по таймеру (если интервал &gt; 0)</li>
        <li>При разрыве соединения автоматически переподключается через 5 секунд</li>
    </ul>
    <p>Кнопки в панели располагаются автоматически: по 3 в ряд, если кнопок меньше 10, и по 4 в ряд, если 10 и более.</p>

    <h3>Учётные данные</h3>
    <p>Токен хранится в учётных данных (credentials) Node-RED и не виден в потоке.</p>
</script>

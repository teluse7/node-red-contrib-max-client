<script type="text/html" data-help-name="max-control">
    <p>Узел кнопки для панели управления MAX.</p>
    <p>Создаёт кнопку в панели управления MAX. При нажатии на кнопку в MAX узел отправляет сообщение в выходной порт.</p>

    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt>Имя</dt>
        <dd>Имя узла для отображения в редакторе Node-RED. Если не указано, используется текст кнопки или «max-control».</dd>

        <dt>Панель <span class="required">обязательно</span></dt>
        <dd>Ссылка на узел <code>max-panel</code> (панель управления в MAX). Обязательно для выбора — без него сохранение невозможно.</dd>

        <dt>Кнопка <span class="required">обязательно</span></dt>
        <dd>Текст, который отображается на кнопке в панели управления MAX. Этот текст видит пользователь.</dd>

        <dt>Действие <span class="required">обязательно</span></dt>
        <dd>Уникальный идентификатор действия. <b>Должен быть уникальным</b> среди всех узлов <code>max-control</code>. При нажатии на кнопку, MAX отправляет событие с этим идентификатором, и узел сопоставляет его с нужной кнопкой.</dd>
    </dl>

    <h3>Выход</h3>
    <dl class="message-properties">
        <dt>payload.user</dt>
        <dd>Идентификатор пользователя, нажавшего на кнопку.</dd>

        <dt>payload.action</dt>
        <dd>Значение действия — то, что было указано в поле «Действие».</dd>

        <dt>payload.button</dt>
        <dd>Текст кнопки, как было указано в настройках.</dd>

        <dt>raw</dt>
        <dd>Полный объект события, полученный от MAX по WebSocket.</dd>
    </dl>

    <h3>Статусы</h3>
    <ul>
        <li><b>Жёлтый кольцо</b> — инициализация</li>
        <li><b>Зелёный точка</b> — подключено к MAX</li>
        <li><b>Красный кольцо</b> — отключено от MAX</li>
        <li><b>Синий точка</b> — последнее действие</li>
    </ul>
</script>

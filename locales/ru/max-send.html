<script type="text/x-red" data-help-name="max-send">
    <p>Узел отправки сообщений и скриншотов через MAX-бота.</p>

    <h3>Назначение</h3>
    <p>Отправляет сообщение из <b>msg.payload</b> или <b>msg.payload.text</b> в мессенджер MAX. При включённой опции делает скриншоты веб-страниц и прикрепляет их к сообщению.</p>

    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt>Имя</dt>
        <dd>Имя узла для отображения в редакторе Node-RED. Если не указано, используется «max-send».</dd>

        <dt>Соединение <span class="required">обязательно</span></dt>
        <dd>Ссылка на узел <code>max-ws-config</code> (настройки подключения к MAX). Без выбора этого узла сохранение невозможно.</dd>

        <dt>Сделать снимки экрана</dt>
        <dd>Если включено, узел попытается сделать скриншоты страниц по ссылкам из сообщения. Для корректной работы требуется доступ к сервису скриншотов или локальному Puppeteer.</dd>

        <dt>Дождаться окончания отрисовки</dt>
        <dd>Включает ожидание полной отрисовки страницы перед созданием снимка. Полезно для панелей Dashboard 2.0 и динамических графиков.</dd>

        <dt>Сервис</dt>
        <dd>Адрес внешнего сервиса (например, <em>teluse7/puppeteer-armv7</em>), если используется удалённый рендеринг. Оставьте пустым, если скриншот делается локально в контейнере Node-RED.</dd>
    </dl>

    <h3>Вход</h3>
    <dl class="message-properties">
        <dt>msg.payload</dt>
        <dd>Текст сообщения, который будет отправлен в MAX. Если в тексте сообщения есть ссылки, при включённой опции <em>Сделать снимки экрана</em>, будут сформированы скриншоты.</dd> 
        <dd>Если задан <b>msg.payload.user</b>, текст сообщения должен располагаться в <b>msg.payload.text</b>.</dd>

        <dt>msg.payload.user (опционально)</dt>
        <dd>Идентификатор пользователя (если требуется отправка только конкретному получателю). Если поле отсутствует, сообщение отправляется всем пользователям из соединения.</dd>
    </dl>

    <h3>Статусы</h3>
    <ul>
        <li><b>Жёлтое кольцо</b> — узел инициализируется.</li>
        <li><b>Зелёная точка</b> — последнее сообщение успешно отправлено.</li>
        <li><b>Красный круг</b> — сбой при отправке.</li>
    </ul>

    <h3>Примечания (для ArmV7)</h3>
    <p>Для работы со скриншотами на платформе ArmV7 необходимо установить в контейнере внешний <em>teluse7/puppeteer-armv7</em> сервис и указать его адрес и порт в поле <b>Сервис</b>.</p>
    <p>При установке контейнера укажите:</p>
    <ul>
        <li>Внутренний порт сервиса: <em>3000</em></li>
        <li>Переменную окружения <b>TZ</b>: по умолчанию <em>Europe/Moscow</em></li>
        <li>Ограничение памяти <b>RAM</b>: рекомендуется <em>2560000000</em> байт (2.5 ГБ) для стабильной работы Puppeteer на iHost</li>
        <li>Лимит <b>CPU</b>: рекомендуется <em>30</em> (в процентах) для предотвращения перегрузки устройства при генерации скриншотов</li>
    </ul>
</script>

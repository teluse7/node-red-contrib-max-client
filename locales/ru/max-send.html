<script type="text/x-red" data-help-name="max-send">
    <p>Узел отправки сообщений через MAX-бота</p>

    <p>Отправляет сообщение из `msg.payload` в мессенджер MAX по номеру `Идентификатор` с ключом доступа `Токен` через MAX-бота по адресу `URL`.</p>
    <p>Если в составе сообщения содержатся web-ссылки, то в мессенджер будут отправлены скриншоты указанных страниц, при условии установленной галочки `Снимок`.</p>
    <p>Некоторые страницы, особенно из состава Dashbord 2.0 для Node-RED, требуют дополнительного контроля загрузки (Контроль холста). Для этого установите гулочку `Контроль`.</p>
</script>

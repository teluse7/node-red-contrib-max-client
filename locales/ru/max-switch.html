<script type="text/html" data-help-name="max-switch">
    <p>Узел переключения панелей MAX.</p>
    <p>Переключает активную панель на указанную. Принимает любое входящее сообщение.</p>
    <p>Если <b>topic</b> содержит идентификатор пользователя, то переключение происходит только для указанного пользователя.</p>

    <h3>Настройки</h3>
    <dl class="message-properties">
        <dt>Имя</dt>
        <dd>Имя узла для отображения в редакторе Node-RED. Если не указано, используется «max-switch».</dd>

        <dt>Панель <span class="required">обязательно</span></dt>
        <dd>Ссылка на узел <code>max-panel</code> (панель управления в MAX). Обязательно для выбора — без него сохранение невозможно.</dd>
    </dl>

    <h3>Вход</h3>
    <dl class="message-properties">
        <dt>payload.user</dt>
        <dd>Идентификатор пользователя, если требуется переключение только для конкретного пользователя.</dd>
    </dl>

    <h3>Статусы</h3>
    <ul>
        <li><b>Жёлтый кольцо</b> — инициализация</li>
        <li><b>Зелёный точка</b> — панель переключена</li>
        <li><b>Красный кольцо</b> — отключено от MAX</li>
    </ul>
</script>

<script type="text/x-red" data-help-name="max-send">
    <p>Node for sending notifications via a MAX-bot</p>

    <p>Sends a message from `msg.payload` to the messenger MAX at the `ID` number with the `Token` access key via the MAX-bot at the `URL` address.</p>
    <p>If the message contains web links, then if the `Render` checkbox is checked, screenshots of the specified pages will be sent to the messenger.</p>
    <p>Some pages, especially those included with Dashboard 2.0 for Node-RED, require additional loading control (Canvas control). To do this, check the `Control` checkbox.</p>

    <p>For the ArmV7 platform, you need to install the external `teluse7/puppeteer-armv7` service in the container and specify its address and port in the `Service` field.</p>
    <p>When setting up the container, specify internal port 3000 and the TZ variable (default: Europe/Moscow), and set the RAM limit to 2,560,000,000 and the CPU limit to 30.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('max-send', {
        category: 'MAX',
        color: '#90cce4',
        defaults: {
            'name': { value: "" },
            'url': { value: "" },
            'userid': { value: "" },
            'scrshot': { value: false },
            'canvasctrl': { value: false },
            'serviceurl': { value: "" }
        },
        credentials: {
            'token': { type: "text" }
        },
        inputs: 1,
        outputs: 1,
        icon: "max-icon.png",
        label: function() {
            return this.name || "node-red-contrib-max-client";
        }
    });
</script>

<script type="text/html" data-template-name="max-send">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i><span data-i18n="max-send.label.name" /></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]max-send.placeholder.name" /><br>
        <label for="node-input-url"><i class="fa fa-globe"></i><span data-i18n="max-send.label.url" /></label>
        <input type="text" id="node-input-url" data-i18n="[placeholder]max-send.placeholder.url" /><br>
        <label for="node-input-user-id"><i class="fa fa-mobile"></i><span data-i18n="max-send.label.userid" /></label>
        <input type="text" id="node-input-userid" data-i18n="[placeholder]max-send.placeholder.userid" /><br>
        <label for="node-input-token"><i class="fa fa-key"></i><span data-i18n="max-send.label.token" /></label>
        <input type="text" id="node-input-token" data-i18n="[placeholder]max-send.placeholder.token" /><br>
        <label for="node-input-scrshot"><i class="fa fa-picture-o"></i><span data-i18n="max-send.label.scrshot" /></label>
        <input type="checkbox" id="node-input-scrshot" name="scrshot" /><br>
        <label for="node-input-canvasctrl"><i class="fa fa-line-chart"></i><span data-i18n="max-send.label.canvasctrl" /></label>
        <input type="checkbox" id="node-input-canvasctrl" name="canvasctrl" /><br>
        <label for="node-input-serviceurl"><i class="fa fa-camera"></i><span data-i18n="max-send.label.serviceurl" /></label>
        <input type="text" id="node-input-serviceurl" data-i18n="[placeholder]max-send.placeholder.serviceurl" /><br>
    </div>
</script>

name: Build README

on:
  push:
    branches: [main]
    paths:
      - 'locales/en-US/**.html'
      - 'tools/build-readme.js'
      - 'README.md'

permissions:
  contents: write

jobs:
  readme:
    # не запускаться на собственных коммитах бота — иначе цикл
    if: ${{ !contains(github.event.head_commit.message, '[skip readme]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate README
        run: node tools/build-readme.js

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README.md from node help [skip readme]"
            git push
          fi

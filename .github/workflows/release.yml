name: Release Node-RED Node

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Extract version from tag
        id: set-version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG → Version: $VERSION"

      - name: Update package.json
        run: |
          npm version ${{ steps.set-version.outputs.VERSION }} \
            --no-git-tag-version --allow-same-version

      - name: Commit and push updated package.json
        run: |
          git add package.json
          if git diff --staged --quiet; then
            echo "No changes — package.json already at this version."
          else
            git commit -m "chore: bump version to ${{ steps.set-version.outputs.VERSION }}"
            git push
            echo "Pushed updated package.json."
          fi

      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to npm
        run: npx npm@latest publish --provenance --access public

      - name: Wait for npm to propagate
        run: sleep 60
      
      - name: Update flows.nodered.org catalogue
        run: |
          MODULE_NAME="node-red-contrib-max-client"

          # Получаем CSRF-токен и сохраняем куки
          curl -s -c /tmp/cookies.txt \
            "https://flows.nodered.org/add/node" > /tmp/page.html

          # Извлекаем токен из HTML
          CSRF_TOKEN=$(grep -oP '_csrf.*?value="[^"]*"' /tmp/page.html | \
            grep -oP 'value="[^"]*"' | grep -oP '[^"]+' | tail -1)

          if [ -z "$CSRF_TOKEN" ]; then
            echo "CSRF token not found, skipping"
            exit 0
          fi

          # Проверяем, что в npm уже нужная версия
          NPM_VERSION=$(curl -s "https://registry.npmjs.org/${MODULE_NAME}/latest" | \
            grep -oP '"version":"[^"]*"' | sed 's/"version":"//;s/"//')
          echo "npm latest version: $NPM_VERSION"
          
          # Отправляем запрос на обновление
          curl -s -b /tmp/cookies.txt \
            -X POST "https://flows.nodered.org/add/node" \
            -H "referer: https://flows.nodered.org/add/node" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "x-requested-with: XMLHttpRequest" \
            -d "_csrf=${CSRF_TOKEN}&module=${MODULE_NAME}"

          echo "Catalogue update requested for ${MODULE_NAME}"

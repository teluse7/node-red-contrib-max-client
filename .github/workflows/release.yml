name: Release Node-RED Node

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Extract version from tag
        id: set-version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG → Version: $VERSION"

      - name: Update package.json
        run: |
          npm version ${{ steps.set-version.outputs.VERSION }} \
            --no-git-tag-version --allow-same-version

      - name: Commit and push updated package.json
        run: |
          git add package.json
          if git diff --staged --quiet; then
            echo "No changes — package.json already at this version."
          else
            git commit -m "chore: bump version to ${{ steps.set-version.outputs.VERSION }}"
            git push
            echo "Pushed updated package.json."
          fi

      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to npm
        run: npx npm@latest publish --provenance --access public
